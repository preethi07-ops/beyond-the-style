
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beyond The Style</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #190f25;
      color: #fff;
      text-align: center;
    }
    header {
      padding: 24px;
      color: #e5c477;
      border-bottom: 1px solid #594064;
      letter-spacing: 2px;
    }
    main { padding: 80px 20px; }
    h1 { font-size: clamp(36px, 7vw, 64px); }
    p { color: #ded3e5; line-height: 1.7; }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 26px;
      background: #e5c477;
      color: #190f25;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>BEYOND THE STYLE</header>
  <main>
    <h1>Discover Your Style</h1>
    <p>Fashion that expresses who you are.</p>
    <p>Explore our world of modern fashion.</p>
    <a href="#collections">Explore Collections</a>
    <section id="collections">
      <h2>Our Collections</h2>
      <p>New styles are coming soon.</p>
    </section>
  </main>
</body>
</html>
